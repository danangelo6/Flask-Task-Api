apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: task-api
    count: 1
images:
  - name: task-api
    newName: task-api
    newTag: local # `make kind-load` loads task-api:local into the kind cluster
patches:
  - target: { kind: Service, name: task-api }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: { kind: ConfigMap, name: task-api-config }
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: local-kind
